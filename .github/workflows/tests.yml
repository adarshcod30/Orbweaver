# The tests that need no dataset. Most of the suite is gated behind artefacts
# in data/processed, which is four gigabytes of raw input away and is not
# something CI should download; those tests skip themselves. What runs here is
# everything that can be checked from the repository alone: the peeling
# algorithm against planted rings, the anchored extractor and its life-cycle
# matcher on hand-built toy graphs, the knapsack against brute force, the
# demo bundle, and the documentation cross-references.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-demo.txt

      - name: Run the tests that need no dataset
        run: python -m pytest tests/ -q

      - name: Check the demo bundle serves a console from a clean checkout
        run: python -m pytest tests/test_demo.py -q

      - name: Check the committed prose
        run: ./scripts/voice_check.sh
